<div class="p-6 pb-24 max-w-lg mx-auto w-full">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Inventario</h1>
    <span class="bg-[#2E7D32] text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm">Total: 450</span>
  </div>

  <!-- Search & Filter -->
  <div class="flex space-x-2 mb-6">
    <div class="relative flex-1">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
      <input type="text" class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#2E7D32] outline-none text-sm bg-white" placeholder="Buscar producto...">
    </div>
    <button class="bg-white border border-slate-200 p-3 rounded-xl text-slate-500 hover:bg-slate-50">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
    </button>
  </div>

  <!-- Inventory List -->
  <div class="grid grid-cols-2 gap-4">
    <!-- Product Card -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between">
      <div>
        <div class="w-full h-24 bg-slate-100 rounded-lg mb-3 flex items-center justify-center text-slate-400">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </div>
        <h3 class="text-xs font-bold text-slate-800 line-clamp-2">Fertilizante NPK 15-15-15</h3>
        <p class="text-[10px] text-slate-500 mt-1">Categoría: Fertilizantes</p>
      </div>
      <div class="mt-3 flex justify-between items-end">
        <p class="font-bold text-[#2E7D32]">$45.00</p>
        <span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded font-medium">Stock: 120</span>
      </div>
    </div>
    
    <!-- Product Card (Low Stock) -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-rose-200 flex flex-col justify-between">
      <div>
        <div class="w-full h-24 bg-slate-100 rounded-lg mb-3 flex items-center justify-center text-slate-400 relative">
           <span class="absolute top-2 right-2 flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-rose-500"></span>
          </span>
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </div>
        <h3 class="text-xs font-bold text-slate-800 line-clamp-2">Semillas de Maíz Híbrido</h3>
        <p class="text-[10px] text-slate-500 mt-1">Categoría: Semillas</p>
      </div>
      <div class="mt-3 flex justify-between items-end">
        <p class="font-bold text-[#2E7D32]">$120.00</p>
        <span class="text-[10px] bg-rose-100 text-rose-700 px-2 py-0.5 rounded font-medium">Stock: 5</span>
      </div>
    </div>
  </div>
</div>
